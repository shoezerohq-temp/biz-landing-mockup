<!doctype html>
<!-- Design gallery page (Benedict, 2026-10-20, T-012). gallery.py fills /*DATA*/ and 16; edit the look here, the design list in gallery.py.
     Grid of shoes -> click -> viewer with every side. Arrows/keys/swipe = sides of this shoe; up/down or the header buttons = other shoes. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microsoft Sample Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a1a; --muted:#666; --line:#e5e5e5; --ground:#f0f0f0; --paper:#fff; --accent:#00704a; --accent-soft:#e6f2ed;
  --r-card:12px; --r-panel:16px; --r-btn:8px;
  --shadow:0 1px 2px rgba(26,26,26,.06),0 6px 16px rgba(26,26,26,.07),0 20px 40px rgba(26,26,26,.08);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.locked{overflow:hidden}
body{margin:0;font:400 15px/1.5 var(--font);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}

.page{max-width:none;margin:0;padding:20px 16px 40px}   /* Benedict Oct 20: less margins */
.intro{margin:0 0 20px}
h1{margin:0;font-weight:800;font-size:clamp(28px,3.2vw,44px);line-height:1.1;letter-spacing:-0.02em;text-wrap:balance}
.intro p{margin:10px 0 0;color:var(--muted);font-size:16px}

.group{margin:0 0 24px}
.group-h{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
.group-h h2{margin:0;font-weight:800;font-size:22px;letter-spacing:-0.02em}
.group-h span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;list-style:none;margin:0;padding:0}

.tile{display:flex;flex-direction:column;height:100%;background:var(--paper);border-radius:var(--r-card);padding:6px 6px 8px;
  text-decoration:none;color:var(--ink);transition:transform 300ms var(--ease),box-shadow 300ms var(--ease)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile:active{transform:translateY(0)}
.tile .pic{aspect-ratio:4/3;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:contain}
.tile .cap{display:flex;gap:6px;margin-top:4px;font-size:13px;line-height:1.3;font-weight:600}
.tile .num{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}

/* viewer */
dialog{padding:0;border:0;background:transparent;color:var(--ink);max-width:none;max-height:none;
  width:min(1120px,calc(100vw - 48px));height:min(920px,calc(100dvh - 48px));overflow:visible}
dialog::backdrop{background:rgba(26,26,26,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
dialog[open]{animation:pop 350ms var(--ease)}
dialog[open]::backdrop{animation:fade 300ms var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel:focus{outline:none}
.panel{display:flex;flex-direction:column;width:100%;height:100%;background:var(--paper);border-radius:var(--r-panel);box-shadow:var(--shadow);overflow:hidden}

.bar{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 24px;border-bottom:1px solid var(--line)}
.title{flex:1;min-width:0}
.title h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title h2 .num{color:var(--muted);font-weight:400;margin-right:6px;font-variant-numeric:tabular-nums}
.title p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-btn);
  background:var(--paper);cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;transition:background 200ms var(--ease),border-color 200ms var(--ease)}
.btn:hover{background:var(--ground);border-color:#d6d6d6}
.btn svg{width:18px;height:18px;flex:none}
.btn.icon{width:40px;padding:0;justify-content:center}

.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 56px;touch-action:pan-y;user-select:none}
.stage img{width:100%;height:100%;object-fit:contain;transition:opacity 200ms var(--ease)}
.stage img.swap{opacity:.25}
.stage .missing{display:none;color:var(--muted);font-size:15px}
.stage.broken img{display:none}.stage.broken .missing{display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:9999px;border:1px solid var(--line);
  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background 200ms var(--ease),box-shadow 200ms var(--ease)}
.arrow:hover{background:var(--paper);box-shadow:var(--shadow)}
.arrow svg{width:22px;height:22px}
.arrow.prev{left:16px}.arrow.next{right:16px}

.sides{border-top:1px solid var(--line);padding:12px 16px 14px}
.strip{position:relative;display:flex;gap:8px;justify-content:center;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#cfcfcf transparent;list-style:none;margin:0;padding:2px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:6px;width:100px;flex:none;padding:6px 6px 8px;border:2px solid transparent;border-radius:10px;
  background:none;cursor:pointer;transition:border-color 200ms var(--ease),background 200ms var(--ease)}
.strip button:hover{background:var(--ground)}
.strip button[aria-current="true"]{border-color:var(--ink)}
.strip .t{width:100%;height:64px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.strip img{width:100%;height:100%;object-fit:contain}
.strip span{font-size:12px;line-height:1.2;color:var(--muted);text-align:center;white-space:nowrap}
.strip button[aria-current="true"] span{color:var(--ink);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:1199px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:959px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:639px){
  .page{padding:28px 16px 56px}
  .intro{margin-bottom:28px}
  .group{margin-bottom:36px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  dialog{width:100vw;height:100dvh}
  .panel{border-radius:0}
  .bar{padding:10px 10px 10px 16px;gap:6px}
  .title h2{font-size:16px}
  .btn .lbl{display:none}
  .btn{width:40px;padding:0;justify-content:center}
  .stage{padding:8px}
  .arrow{width:40px;height:40px}.arrow.prev{left:8px}.arrow.next{right:8px}
  .sides{padding:8px 8px 12px}
  .strip{justify-content:flex-start}
  .strip button{width:68px;padding:4px}
  .strip .t{height:46px}
  .strip span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after,dialog[open],dialog[open]::backdrop{animation:none!important;transition:none!important}
  .tile:hover{transform:none}
}
</style></head><body>
<main class="page">
  <header class="intro">
    <h1>Microsoft Sample Designs</h1>
    <p>16 designs. Click any shoe to see it from every side.</p>
  </header>
  <div id="groups"></div>
</main>

<dialog id="viewer" aria-labelledby="v-name">
  <div class="panel" tabindex="-1">
    <div class="bar">
      <div class="title"><h2 id="v-name"></h2><p id="v-side" aria-live="polite"></p></div>
      <button class="btn" id="v-prevd" type="button" aria-label="Previous design"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg><span class="lbl">Previous design</span></button>
      <button class="btn" id="v-nextd" type="button" aria-label="Next design"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span class="lbl">Next design</span></button>
      <button class="btn icon" id="v-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="stage" id="v-stage">
      <img id="v-img" alt="">
      <p class="missing">This side isn't available yet.</p>
      <button class="arrow prev" id="v-prev" type="button" aria-label="Previous side"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="arrow next" id="v-next" type="button" aria-label="Next side"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <nav class="sides" aria-label="Sides"><ul class="strip" id="v-strip"></ul></nav>
  </div>
</dialog>

  if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) side(dx < 0 ? 1 : -1);
});
const start = flat.findIndex(d => '#' + d.slug === location.hash);   // a shared link opens its shoe
if (start >= 0) open(start);
</script>
